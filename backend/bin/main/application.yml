spring:
  application:
    name: musicstudio
  # 로컬 개발용 기본값. 저장소 루트의 docker-compose.yml과 맞춘다.
  # 서버에서는 환경 변수(SPRING_DATASOURCE_URL 등)로 덮어쓴다.
  datasource:
    url: jdbc:postgresql://localhost:5432/musicstudio
    username: musicstudio
    password: musicstudio
  jpa:
    # 스키마는 Flyway만 바꾼다. JPA는 엔티티와 스키마가 맞는지 검사만 한다.
    hibernate:
      ddl-auto: validate
    # 컨트롤러까지 영속성 컨텍스트를 열어 두지 않는다. 지연 로딩은 서비스 안에서 끝낸다.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          # 레슨 회차는 일정 하나에 수십~백여 행을 한 번에 넣는다. 묶어서 보내야 왕복이 한 번이다
          # (시퀀스를 50씩 늘리는 것도 이때 ID를 한 번에 받기 위해서다)
          batch_size: 50
        order_inserts: true
        order_updates: true
app:
  jwt:
    # 32바이트 이상. 로컬은 build.gradle.kts의 bootRun이 넣어 준다.
    secret: ${JWT_SECRET:}
    # 갱신 토큰은 MVP에 없으므로 접근 토큰을 12시간 동안 쓴다.
    ttl: 12h
  crypto:
    # 개인정보 암호화 키. base64로 인코딩한 32바이트. 없으면 서버가 뜨지 않는다.
    key: ${APP_CRYPTO_KEY:}
  # 파일 저장소 (ADR 0017). 로컬 기본값은 docker-compose의 SeaweedFS(S3 API, 8333).
  # 운영(S3)은 endpoint·키를 비우고(EC2 역할) create-bucket을 끈다(버킷은 Terraform이 만든다)
  storage:
    endpoint: ${APP_STORAGE_ENDPOINT:http://localhost:8333}
    region: ${APP_STORAGE_REGION:ap-northeast-2}
    bucket: ${APP_STORAGE_BUCKET:musicstudio}
    access-key: ${APP_STORAGE_ACCESS_KEY:musicstudio}
    secret-key: ${APP_STORAGE_SECRET_KEY:musicstudio-dev-secret}
    create-bucket: ${APP_STORAGE_CREATE_BUCKET:true}
  social:
    # 비어 있으면 구글 로그인을 끈다. 값은 Google Cloud Console의 OAuth 클라이언트(웹)에서 받는다.
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      allowed-redirect-uris: ${GOOGLE_REDIRECT_URIS:http://localhost:5173/auth/callback/google}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
