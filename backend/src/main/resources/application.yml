spring:
  application:
    name: musicstudio
  # 로컬 개발용 기본값. 저장소 루트의 docker-compose.yml과 맞춘다.
  # 서버에서는 환경 변수(SPRING_DATASOURCE_URL 등)로 덮어쓴다.
  datasource:
    url: jdbc:postgresql://localhost:5432/musicstudio
    username: musicstudio
    password: musicstudio
  jpa:
    # 스키마는 Flyway만 바꾼다. JPA는 엔티티와 스키마가 맞는지 검사만 한다.
    hibernate:
      ddl-auto: validate
    # 컨트롤러까지 영속성 컨텍스트를 열어 두지 않는다. 지연 로딩은 서비스 안에서 끝낸다.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
app:
  jwt:
    # 32바이트 이상. 로컬은 build.gradle.kts의 bootRun이 넣어 준다.
    secret: ${JWT_SECRET:}
    # 갱신 토큰은 MVP에 없으므로 접근 토큰을 12시간 동안 쓴다.
    ttl: 12h

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
