<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>관리자 – 예약 정책</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <header>
    <button id="menuToggle" class="hamburger" aria-label="사이드바 열기">
      <span></span><span></span><span></span>
    </button>
    <img src="images/dku-logo.png" alt="DKU Logo">
    <div class="title">
      <h1>단국대학교 뉴뮤직학부</h1>
      <p>Dankook University New Music</p>
    </div>
  </header>

  <div class="wrapper">
    <nav id="sidebarNav" class="sidebar">
      <ul>
        <li><a href="admin_userlist.html">사용자 관리</a></li>
        <li><a href="admin_booking.html">연습실 관리</a></li>
        <li><a href="admin_booking_list.html">예약 내역</a></li>
        <li><a href="admin_making_room.html">연습실 수정</a></li>
        <li><a href="admin_policy.html" class="active">예약 정책</a></li>
      </ul>
    </nav>

    <main class="content">
      <button id="logout" class="logout-btn">로그아웃</button>
      <h2>예약 정책</h2>
      <p class="section-desc">
        여기서 바꾼 규칙은 저장하는 즉시 예약 화면에 적용됩니다.
      </p>

      <form id="policyForm" class="policy-form" novalidate>

        <fieldset class="policy-group">
          <legend>같은 날 재예약</legend>
          <p class="field-help">
            자기 예약끼리 시간이 겹치는 것은 어느 규칙에서든 항상 막힙니다.
            아래는 그 외에 무엇을 더 제한할지 정합니다.
          </p>
          <label class="radio-row">
            <input type="radio" name="same_day_mode" value="NO_OVERLAP">
            <span>
              <strong>겹치지만 않으면 허용</strong>
              <small>비어 있는 시간이면 순서에 상관없이 잡을 수 있습니다. 오후 예약이 있어도 오전을 추가로 잡을 수 있습니다.</small>
            </span>
          </label>
          <label class="radio-row">
            <input type="radio" name="same_day_mode" value="SEQUENTIAL">
            <span>
              <strong>시간 순서대로만</strong>
              <small>이전 예약이 끝난 뒤 시간대만 잡을 수 있습니다. 더 이른 시간은 비어 있어도 잡을 수 없습니다.</small>
            </span>
          </label>
          <label class="radio-row">
            <input type="radio" name="same_day_mode" value="ONE_PER_DAY">
            <span>
              <strong>하루 1건</strong>
              <small>하루에 한 건만 예약할 수 있습니다.</small>
            </span>
          </label>
        </fieldset>

        <fieldset class="policy-group">
          <legend>시간 제한</legend>
          <div class="field-row">
            <label for="max_minutes">예약 1건 최대 길이</label>
            <div class="field-input">
              <input type="number" id="max_minutes" name="max_minutes" min="30" max="720" step="30" required>
              <span class="unit">분</span>
            </div>
          </div>
          <div class="field-row">
            <label for="cancel_deadline_min">취소 마감</label>
            <div class="field-input">
              <input type="number" id="cancel_deadline_min" name="cancel_deadline_min" min="0" max="1440" step="5" required>
              <span class="unit">분 전까지</span>
            </div>
          </div>
          <div class="field-row">
            <label for="slot_minutes">슬롯 단위</label>
            <div class="field-input">
              <input type="number" id="slot_minutes" name="slot_minutes" min="10" max="120" step="10" required>
              <span class="unit">분</span>
            </div>
          </div>
        </fieldset>

        <fieldset class="policy-group">
          <legend>운영 시간</legend>
          <div class="field-row">
            <label for="open_time">시작</label>
            <div class="field-input">
              <input type="time" id="open_time" name="open_time" required>
            </div>
          </div>
          <div class="field-row">
            <label for="close_time">종료</label>
            <div class="field-input">
              <input type="time" id="close_time" name="close_time" required>
            </div>
          </div>
        </fieldset>

        <fieldset class="policy-group">
          <legend>주간 예약 오픈</legend>
          <p class="field-help">이 시점이 지나면 다음 주 예약을 받습니다.</p>
          <div class="field-row">
            <label for="week_open_weekday">요일</label>
            <div class="field-input">
              <select id="week_open_weekday" name="week_open_weekday" required>
                <option value="0">월요일</option>
                <option value="1">화요일</option>
                <option value="2">수요일</option>
                <option value="3">목요일</option>
                <option value="4">금요일</option>
                <option value="5">토요일</option>
                <option value="6">일요일</option>
              </select>
            </div>
          </div>
          <div class="field-row">
            <label for="week_open_time">시각</label>
            <div class="field-input">
              <input type="time" id="week_open_time" name="week_open_time" required>
            </div>
          </div>
        </fieldset>

        <div id="policyMsg" class="form-msg" hidden></div>

        <div class="form-actions">
          <button type="button" id="policyReset" class="btn-secondary">되돌리기</button>
          <button type="submit" id="policySave">저장</button>
        </div>
      </form>
    </main>
  </div>

  <script src="js/admin_policy.js"></script>
</body>
</html>
