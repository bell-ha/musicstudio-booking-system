<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>로그인 | 뉴뮤직 예약 시스템</title>
  <!-- 공통 스타일 -->
  <link rel="stylesheet" href="css/common.css">
  <!-- [추가] 인증 화면 전용 오버레이. common.css 뒤에 와야 합니다. -->
  <link rel="stylesheet" href="css/auth.css">
</head>
<!-- [변경] body에 클래스 2개 추가. auth.css의 모든 규칙이 이 클래스 아래로
     한정돼 있어 user.html·admin 화면에는 영향이 없습니다. -->
<body class="nm-auth nm-page-login">

  <!-- 헤더 — 다른 페이지와 같아야 하므로 마크업 그대로 둡니다 -->
  <header>
    <img src="images/dku-logo.png" alt="DKU Logo">
    <div class="title">
      <h1>단국대학교 뉴뮤직학부</h1>
      <p>Dankook University New Music</p>
    </div>
  </header>

  <!-- 중앙 카드 -->
  <div class="main-container">
    <div class="card">
      <!-- 로그인 박스 -->
      <div class="login-box">
        <!-- [변경] "Login" → "로그인". 페이지의 나머지가 전부 한글인데
             제목만 영문 한 단어였습니다. -->
        <h2>로그인</h2>

        <!-- ⚠️ [내용 오류 수정 — 확인 필요]
             원문: "학번(########)과 비밀번호를 입력해 주세요."
             backend/app/routers/auth.py:23은 User.login_id로 사용자를 찾습니다.
             login_id는 회원가입에서 학번과 별개로 직접 정하는 값이고
             (routers/user.py:68·80, 영문/숫자/특수문자 최소 2자),
             학번(student_id)은 다른 컬럼입니다.
             즉 학번을 넣으라는 현재 안내는 사실과 다르고, 그대로 따르면
             로그인이 실패합니다. "아이디"로 바로잡았습니다. -->
        <p>실기실 예약 시스템을 이용하려면 로그인이 필요합니다.</p>

        <form id="loginForm">
          <label>
            <!-- name="login_id"는 main.js:30이 참조하므로 그대로 둡니다 -->
            아이디
            <input name="login_id" required
                   placeholder="회원가입 때 정한 아이디"
                   autocomplete="username">
          </label>
          <label>
            비밀번호
            <input type="password" name="password" required
                   placeholder="비밀번호" autocomplete="current-password">
          </label>
          <button type="submit">로그인</button>
        </form>

        <!-- [추가] 승인 대기 안내.
             main.js:43-44는 승인 전 계정에 alert만 띄우고 끝나서 학생이
             다음에 뭘 해야 할지 알 수 없습니다. 미리 알려 문의를 줄입니다. -->
        <p class="auth-note">
          회원가입 후 관리자 승인이 완료되어야 로그인할 수 있습니다.
          승인 전에는 로그인이 되지 않습니다.
        </p>

        <!-- [변경] 안내 문구를 span으로 감쌌습니다(래퍼 추가).
             #goRegister id는 main.js:55가 쓰므로 유지. 신규 학생이 제일
             먼저 찾는 경로라 각주 링크에서 보조 버튼으로 올렸습니다. -->
        <p class="register">
          <span>계정이 없으신가요?</span>
          <button id="goRegister">회원가입</button>
        </p>
      </div>

      <!-- 공지 박스 -->
      <div class="notice-box">
        <!-- [변경] "📰 New Music NEWS" → "공지사항".
             학교 공식 시스템이라 이모지를 뺐고(맥 기본 렌더링에서 회색
             네모로 보입니다), 영문 브랜드명 대신 기능 이름을 씁니다. -->
        <h2>공지사항</h2>
        <!-- id 유지 필수: main.js:9가 이 id로 목록을 채웁니다.
             비었을 때의 안내는 auth.css의 :empty 규칙이 처리합니다. -->
        <ul id="public-notice-list"></ul>
      </div>
    </div>
  </div>

  <!-- index.html 전용 스크립트 -->
  <script src="js/main.js" defer></script>
</body>
</html>
