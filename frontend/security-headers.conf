# 보안 헤더. nginx의 add_header는 location 안에 add_header가 하나라도 있으면 바깥 것을 물려받지 않으므로,
# 이 파일을 각 location에서 include한다.
# CSP: Pretendard CSS·폰트만 jsdelivr에서 온다. 인라인 스크립트와 인라인 스타일 속성은 쓰지 않는다.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# HSTS는 TLS가 생기는 배포 때 넣는다.
